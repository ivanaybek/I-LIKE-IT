<!DOCTYPE html>
<html>
    <head>
        <title>I LIKE IT | Kayıt Tamamlandı</title>
        <link rel="stylesheet" href="./style.css">
        <script>
            function isNumberKey(evt) {
            var charCode = (evt.which) ? evt.which : event.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57))
            return false;
            return true;
        }
        </script>
    </head>
    <body>
        <header id="header">
            <img src="./Logo.jpg" alt="I LIKE IT | Logo" id="header-logo">
            <h1 id="header-line">|</h1>
            <a href="#" id="header-a">I LIKE IT</a>
            <button id="header-menu">📂</button>
            <button id="header-help">❓</button>
        </header>

        <div id="header-div">
            <h1 id="header-div-h1">I LIKE IT | Kayıt</h1>
        </div>

        <div id="main-div">
            <p id="main-div-p-1">Kaydın tamamlandı. Ama doğrulamamız gerekiyor</p>
            <label for="main-div-input" id="label">E-Posta adresine gönderdiğimiz kodu gir:</label>
            <input type="text" id="main-div-input" value="frostaybek@gmail.com">

            <div id="main-div-2">
                <input id="main-div-numbers" value="523675" required pattern="\1{6}" maxlength="6" autocomplete="off" onkeypress="return isNumberKey(event)">
                <button id="main-div-contunie">Devam Et</button>
            </div>

            <div id="main-div-3">
                <p id="wrong-mail">Yanlış E-Posta mı?   </p>
                <button id="change-mail">Değiştir</button>
            </div>
            
        </div>
        
        <footer id="footer">
            <button id="footer-language">TR</button>
            <button id="footer-theme">🌓</button>
        </footer>
    </body>
</html>
