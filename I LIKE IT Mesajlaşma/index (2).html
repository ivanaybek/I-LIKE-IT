<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Hakkında</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <button id="header-menu">📂</button>
        <button id="header-help">❔</button>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">Mesajlaşma</h1>
        <button id="header-button">⚙</button>
    </div>

    <div class="main">
        <div class="msg-box">
            <div class="msg">
                <img src="./GIF.gif" alt="Photo" class="img">
                <p class="msg-box-p">Benten</p>
                <span class="msg-box-span">19:06</span>
            </div>
        </div>
        <div class="msg-box">
            <div class="msg">
                <img src="./GIF.gif" alt="Photo" class="img">
                <p class="msg-box-p">Ayten</p>
                <span class="msg-box-span">17:42</span>
            </div>
        </div>
        <div class="msg-box">
            <div class="msg">
                <img src="./GIF.gif" alt="Photo" class="img">
                <p class="msg-box-p">Nurten</p>
                <span class="msg-box-span">04:45</span>
            </div>
        </div>
        <div class="msg-box">
            <div class="msg">
                <img src="./GIF.gif" alt="Photo" class="img">
                <p class="msg-box-p">Turten</p>
                <span class="msg-box-span">21:41</span>
            </div>
        </div>
        <div class="start-messaging">

        </div>
    </div>

    <footer id="footer">
        <button id="resume-button">Ana Sayfa'ya Dön</button>
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
