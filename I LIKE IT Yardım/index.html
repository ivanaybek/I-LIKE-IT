<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Hakkında</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <button id="header-menu">📂</button>
        <button id="header-help">❔</button>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">Yardım</h1>
        <button id="header-button">⚙</button>
    </div>

    <div id="main-div">
        <div id="main-div-color">
            <p id="main-div-color-p">Yardım Dili:</p>
            <button id="ask-question">Soru Sor</button>
            <select id="main-div-select">
                <option name="tr" class="options" value="1">
                    Türkçe
                </option>
                <option name="en" class="options" value="2">
                    English
                </option>
                <option name="de" class="options" value="2">
                    Deutsch
                </option>
                <option name="ry" class="options" value="2">
                    Pусский
                </option>
            </select>
        </div>

        <div class="div-left">
            <p class="div-left-p">Kayıt olamıyorum</p>
        </div>

        <div class="div-right">
            <p class="div-right-p">Giriş yapamıyorum</p>
        </div>

        <hr class91="hr">

        <div class="div-left">
            <p class="div-left-p">Hesabıma ulaşamıyorum</p>
        </div>

        <div class="div-right">
            <p class="div-right-p">Hesabım sebepsiz kapatıldı</p>
        </div>

        <hr class="hr">

        <div class="div-left">
            <p class="div-left-p">Hediye gönderemiyorum</p>
        </div>

        <div class="div-right">
            <p class="div-right-p">Diğer</p>
        </div>

        <hr class="hr">
        
        <br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br>
        <br><br>

        <div id="notification-resume">
            <p id="notification-resume-p">🔻</p>
        </div>

    </div>

    <footer id="footer">
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
