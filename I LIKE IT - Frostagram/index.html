<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Hakkında</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Kalam&family=Roboto:wght@300&display=swap');

        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            user-select: none;
            font-family: calibri, sans-serif;
        }

        body{
            background-color: #323a42; 
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        ::selection{
            color: white;
            background-color: #d33639;
        }

        #header{
            background-color: #45668e;
            width: 100%;
            height: 82px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: relative;
        }

        #header-img{
            height: 52px;
            width: 52px;
            border-radius: 10px;
            cursor: pointer;
            transition-duration: 0.4s;
            -webkit-user-drag: none;
            object-fit: cover;
        }

        #header-img:hover{
            filter: saturate(2);
        }

        #line{
            font-family: roboto, sans-serif;
            font-size: 45px;
            margin: 0 10px;
            color: #000;
        }

        #header-h1{
            font-family: kalam, cursive;
            font-size: 32px;
            cursor: pointer;
            transition-duration: 0.1s;
        }

        #header-h1:active{
            transform: translateY(2px);
        }

        #header-h1:hover{
            color: #323a42;    
        }

        .header-right-group {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        #header-menu, #header-help{
            width: 50px;
            height: 45px;
            border: 0px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 24px;
            background: linear-gradient(135deg, #9b27ca 0%, #9927cf 0%, #d33639 100%, #f92121 100%);
            color: white;
            transition-duration: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2px;
        }

        #header-menu:hover, #header-help:hover{
            filter:saturate(2);
        }

        #header-menu:active, #header-help:active{
            transform: translateY(2px);
        }

        #header-div{
            background-color: #282c31;
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #header-div-h1{
            color: rgb(214, 198, 198);
            font-size: 26px;
            user-select: text;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #header-div-h1:hover{
            color: white;
        }

        #header-button{
            height: 45px;
            width: 60px;
            cursor: pointer;
            transition-duration: 0.4s;
            font-size: 26px;
            color: black;
            background-color: rgb(255, 123, 0);
            border: 0px;
            border-radius: 4px;
        }

        #header-button:hover{
            background-color: rgba(255, 123, 0, 0.788);
        }

        #header-button:active{
            background-color: rgba(255, 123, 0, 0.555);
        }

        .main{
            margin: 25px auto;
            width: 90%;
            max-width: 800px;
            border: 2px solid black;
            border-radius: 6px;
            background-color: #282c31;
            overflow: hidden;
        }

        .article{
            background-color: crimson;
            height: 75px;
            display: flex;
            align-items: center;
        }

        .main-h1::selection{
            background: purple;
        }

        .main-h1{
            user-select: text;
            font-size: 28px;
            color: white;
            padding: 0 20px;
        }

        .section{
            padding: 25px 20px;
        }

        .main-p{
            color: white;
            font-size: 18px;
            user-select: text;
            text-align: center;
            line-height: 1.6;
        }

        .main-p::selection{
            background: purple;
        }

        #footer{
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: #22252a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        #language-button, #dark-mode-button{
            height: 36px;
            padding: 0 12px;
            border: 0px;
            outline: none;
            font-size: 14px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #language-button{ background-color: crimson; }
        #language-button:hover{ background-color: rgb(182, 25, 57); }

        #dark-mode-button{ background-color: rgb(26, 25, 25); }
        #dark-mode-button:hover{ background-color: rgb(0, 0, 0); }

        #resume-button{
            background-color: #bb0000;
            border: 0px;
            height: 36px;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            transition-duration: 0.4s;
            outline: none;
        }

        #resume-button:hover{
            background-color: #bb0000c9;
        }

        #resume-button:active{
            background-color: #bb000096;
        }

        @media (max-width: 600px) {
            .main-h1 {
                font-size: 22px;
            }
            .main-p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">Frostagram</h1>
        <div class="header-right-group">
            <button id="header-menu">📂</button>
            <button id="header-help">❔</button>
        </div>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">Bilgilendirme</h1>
        <button id="header-button">⚙</button>
    </div>

    <div class="main">
        <div class="article">
            <h1 class="main-h1">
                Frostagram Bilgilendirme
            </h1>
        </div>
        <div class="section">
            <p class="main-p">
                Uzun süredir "I LIKE IT" olan şirketin adı "Frostagram" olarak değiştirildi. :) <br><br>
                Eski markadan sadece geride kalan isim! Yenilikler bizi bekliyor.
            </p>
        </div>
    </div>

    <footer id="footer">
        <button id="resume-button">Ana Sayfa'ya Dön</button>
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
