<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Hakkında</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <button id="header-menu">📂</button>
        <button id="header-help">❔</button>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">Bildirimler</h1>
        <button id="header-button">⚙</button>
    </div>

    <div id="main-div">
        <div id="main-div-color">
            <p id="main-div-color-p">Bildirim Dili:</p>
            <select id="main-div-select">
                <option name="tr" class="options" value="1">
                    Türkçe
                </option>
                <option name="en" class="options" value="2">
                    English
                </option>
                <option name="de" class="options" value="2">
                    Deutsch
                </option>
                <option name="ry" class="options" value="2">
                    Pусский
                </option>
            </select>
        </div>

        <div id="notification-1">
            <p id="not-p1">Yeni takip isteği:</p>
            <a href="#" id="not-username1">@dan_riffraff</a>
            <img src="./Img.jpg" alt="Okunmamış Sayacı" class="rozet">
            <div id="notification-1-buttons">
                <button id="notification-1-button-1">❌</button>
                <button id="notification-1-button-2">➡</button>
                <button id="notification-1-button-3">⬅</button>
                <button id="notification-1-button-4">📎</button>
            </div>
        </div>

        <div id="notification-2">
            <p id="not-p2">I LIKE IT veri paketin hazır:</p>
            <a href="#" id="not-username2">Buradan indir</a>
            <img src="./Img.jpg" alt="Okunmamış Sayacı" class="rozet">
            <div id="notification-2-buttons">
                <button id="notification-2-button-1">❌</button>
                <button id="notification-2-button-2">➡</button>
                <button id="notification-2-button-3">⬅</button>
                <button id="notification-2-button-4">📎</button>
            </div>
        </div>

        <br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br>
        <br><br><br><br><br>

        <div id="notification-resume">
            <p id="notification-resume-p">🔻</p>
        </div>

    </div>

    <footer id="footer">
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
