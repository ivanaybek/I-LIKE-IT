<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Hakkında</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Kalam&family=Roboto:wght@300&display=swap');

        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            user-select: none;
            font-family: calibri, sans-serif;
        }

        body{
            background-color: #323a42; 
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        ::selection{
            color: white;
            background-color: #d33639;
        }

        #header{
            background-color: #45668e;
            width: 100%;
            height: 82px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: relative;
        }

        #header-img{
            height: 52px;
            width: 52px;
            border-radius: 10px;
            cursor: pointer;
            transition-duration: 0.4s;
            -webkit-user-drag: none;
            object-fit: cover;
        }

        #header-img:hover{
            filter: saturate(2);
        }

        #line{
            font-family: roboto, sans-serif;
            font-size: 45px;
            margin: 0 10px;
            color: #000;
        }

        #header-h1{
            font-family: kalam, cursive;
            font-size: 32px;
            cursor: pointer;
            transition-duration: 0.1s;
        }

        #header-h1:active{
            transform: translateY(2px);
        }

        #header-h1:hover{
            color: #323a42;    
        }

        .header-right-group {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        #header-menu, #header-help{
            width: 50px;
            height: 45px;
            border: 0px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 24px;
            background: linear-gradient(135deg, #9b27ca 0%, #9927cf 0%, #d33639 100%, #f92121 100%);
            color: white;
            transition-duration: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2px;
        }

        #header-menu:hover, #header-help:hover{
            filter:saturate(2);
        }

        #header-menu:active, #header-help:active{
            transform: translateY(2px);
        }

        #header-div{
            background-color: #282c31;
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #header-div-h1{
            color: rgb(214, 198, 198);
            font-size: 26px;
            user-select: text;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #header-div-h1:hover{
            color: white;
        }

        #header-button{
            height: 45px;
            width: 60px;
            cursor: pointer;
            transition-duration: 0.4s;
            font-size: 26px;
            color: black;
            background-color: rgb(255, 123, 0);
            border: 0px;
            border-radius: 4px;
        }

        #header-button:hover{
            background-color: rgba(255, 123, 0, 0.788);
        }

        #header-button:active{
            background-color: rgba(255, 123, 0, 0.555);
        }

        #main{
            width: 90%;
            max-width: 900px;
            margin: 25px auto;
            border: 1px solid gray;
            border-radius: 6px;
            background-color: #282c31;
            display: flex;
            overflow: hidden;
        }

        #left-div{
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid gray;
        }

        #right-div{
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid gray;
        }

        #left-img{
            width: 140px;
            height: 280px;
            object-fit: contain;
            -webkit-user-drag: none;
            display: block;
            margin-bottom: 15px;
        }

        #right-img{
            width: 100%;
            max-width: 280px;
            height: 280px;
            object-fit: cover;
            -webkit-user-drag: none;
            display: block;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        #left-p, #right-p{
            text-align: center;
            color: white;
            font-size: 24px;
            margin-bottom: 15px;
            user-select: text;
        }

        #left-btn, #right-btn{
            width: 160px;
            height: 42px;
            border-radius: 4px;
            border: 0px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition-duration: 0.4s;
            background-color: #DD2A7B;
        }

        #left-btn:hover, #right-btn:hover{
            background-color: #dd2a7bb6;
        }

        #left-btn:active, #right-btn:active{
            background-color: #dd2a7b7e;
        }

        #footer{
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: #22252a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        #language-button, #dark-mode-button{
            height: 36px;
            padding: 0 12px;
            border: 0px;
            outline: none;
            font-size: 14px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #language-button{ background-color: crimson; }
        #language-button:hover{ background-color: rgb(182, 25, 57); }

        #dark-mode-button{ background-color: rgb(26, 25, 25); }
        #dark-mode-button:hover{ background-color: rgb(0, 0, 0); }

        #resume-button{
            background-color: #bb0000;
            border: 0px;
            height: 36px;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            transition-duration: 0.4s;
            outline: none;
        }

        #resume-button:hover{
            background-color: #bb0000c9;
        }

        #resume-button:active{
            background-color: #bb000096;
        }

        @media (max-width: 768px) {
            #main {
                flex-direction: column;
                width: 95%;
            }
            #left-div {
                border-right: none;
                border-bottom: 1px solid gray;
            }
            #right-div {
                border-left: none;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <div class="header-right-group">
            <button id="header-menu">📂</button>
            <button id="header-help">❔</button>
        </div>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">I LIKE IT | İşletmeni Oluştur</h1>
        <button id="header-button">⚙</button>
    </div>

    <div id="main">
        <div id="left-div">
            <img src="./Kendim.png" alt="Resim" id="left-img">
            <p id="left-p">Kendim İçin</p>
            <button id="left-btn">Seç</button>
        </div>
        <div id="right-div">
            <img src="./Şirket.jpg" alt="Resim2" id="right-img">
            <p id="right-p">Şirketim İçin</p>
            <button id="right-btn">Seç</button>
        </div>
    </div>

    <footer id="footer">
        <button id="resume-button">Ana Sayfa'ya Dön</button>
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
