<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT İndir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Kalam&family=Roboto:wght@300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: calibri, sans-serif;
        }

        body {
            background-color: #323a42;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Footer için boşluk */
        }

        ::selection {
            color: white;
            background-color: #d33639;
        }

        #header {
            background-color: #45668e;
            width: 100%;
            height: 82px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: relative;
        }

        #header-img {
            height: 52px;
            width: 52px;
            border-radius: 10px;
            cursor: pointer;
            transition-duration: 0.4s;
            -webkit-user-drag: none;
            object-fit: cover;
        }

        #header-img:hover {
            filter: saturate(2);
        }

        #line {
            font-family: roboto, sans-serif;
            font-size: 45px;
            margin: 0 10px;
            color: #000;
        }

        #header-h1 {
            font-family: kalam, cursive;
            font-size: 32px;
            cursor: pointer;
            transition-duration: 0.1s;
        }

        #header-h1:active {
            transform: translateY(2px);
        }

        #header-h1:hover {
            color: #323a42;    
        }

        .header-right-group {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        #header-menu, #header-help {
            width: 50px;
            height: 45px;
            border: 0;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 22px;
            background: linear-gradient(135deg, #9b27ca 0%, #9927cf 0%, #d33639 100%, #f92121 100%);
            color: white;
            transition-duration: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #header-menu:hover, #header-help:hover {
            filter: saturate(2);
        }

        #header-menu:active, #header-help:active {
            transform: translateY(2px);
        }

        #header-div {
            background-color: #282c31;
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #header-div-h1 {
            color: rgb(214, 198, 198);
            font-size: 28px;
            user-select: text;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #header-div-h1:hover {
            color: white;
        }

        #header-button {
            height: 45px;
            width: 60px;
            cursor: pointer;
            transition-duration: 0.4s;
            font-size: 26px;
            color: black;
            background-color: rgb(255, 123, 0);
            border: 0;
            border-radius: 4px;
        }

        #header-button:hover {
            background-color: rgba(255, 123, 0, 0.788);
        }

        #header-button:active {
            background-color: rgba(255, 123, 0, 0.555);
        }

        /* Ana İçerik Alanı (Overflow ve Genişlik Düzeltildi) */
        #main {
            width: 90%;
            max-width: 850px;
            margin: 25px auto;
            border: 2px solid black;
            border-radius: 6px;
            padding: 25px 20px;
            background-color: #282c31;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #main-h1 {
            text-align: center;
            color: white;
            font-size: 32px;
            user-select: text;
            margin-bottom: 8px;
        }

        #main-p {
            color: white;
            text-align: center;
            font-size: 16px;
            user-select: text;
            margin-bottom: 25px;
        }

        /* 3 Kartı Masaüstünde Tamamen Yan Yana Tutan Alan */
        .download-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap; /* Mobilde alt alta geçmesi için */
        }

        .container {
            border: 1px solid gray;
            width: 175px;
            height: 180px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: #202327;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
        }

        .p-1 {
            color: white;
            text-align: center;
            user-select: text;
            font-size: 14px;
        }

        .img-1 {
            max-width: 100px;
            max-height: 55px;
            object-fit: contain;
            border-radius: 8px;
        }

        #img-1 {
            width: 95px;
            height: 50px;
        }

        #img-2 {
            width: 65px;
            height: 50px;
        }

        #img-3 {
            width: 50px;
            height: 50px;
        }

        .a-1 {
            text-decoration: none;
            font-size: 15px;
            border: 1px solid yellowgreen;
            border-radius: 8px;
            transition-duration: 0.4s;
            color: yellowgreen;
            padding: 4px 12px;
            text-align: center;
            width: 90px;
        }

        .a-1:hover {
            background-color: yellowgreen;
            color: white;
        }

        /* Footer */
        #footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: #22252a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        #language-button, #dark-mode-button {
            height: 36px;
            padding: 0 12px;
            border: 0;
            outline: none;
            font-size: 14px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            transition-duration: 0.4s;
        }

        #language-button { background-color: crimson; }
        #language-button:hover { background-color: rgb(182, 25, 57); }

        #dark-mode-button { background-color: rgb(26, 25, 25); }
        #dark-mode-button:hover { background-color: rgb(0, 0, 0); }

        #resume-button {
            background-color: #bb0000;
            border: 0;
            height: 36px;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            transition-duration: 0.4s;
            outline: none;
        }

        #resume-button:hover { background-color: #bb0000c9; }

        /* Responsive Düzenlemeler (Mobil için) */
        @media (max-width: 650px) {
            #main {
                width: 95%;
                padding: 20px 10px;
            }

            .download-grid {
                flex-direction: column;
                align-items: center;
            }

            .container {
                width: 100%;
                max-width: 240px;
                height: auto;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <div class="header-right-group">
            <button id="header-menu">📂</button>
            <button id="header-help">❔</button>
        </div>
    </header>

    <div id="header-div">
        <h1 id="header-div-h1">İndir</h1>
        <button id="header-button">⚙</button>
    </div>

    <div id="main">
        <h1 id="main-h1">I LIKE IT İndir</h1>
        <p id="main-p">İndireceğin dosyayı işletim sistemine uyumlu seç.</p>

        <!-- Windows, Linux ve Mac Kartları Yan Yana -->
        <div class="download-grid">
            <div class="container" id="ctn1">
                <img src="./Windows.jpg" alt="Windows Logo" id="img-1" class="img-1">
                <p class="p-1">Windows için İndir</p>
                <a href="#" class="a-1">İndir</a>
            </div>

            <div class="container" id="ctn2">
                <img src="./Linux.jpg" alt="Linux Logo" id="img-2" class="img-1">
                <p class="p-1">Linux için İndir</p>
                <a href="#" class="a-1">İndir</a>
            </div>

            <div class="container" id="ctn3">
                <img src="./Mac.jpg" alt="Mac Logo" id="img-3" class="img-1">
                <p class="p-1">Mac için İndir</p>
                <a href="#" class="a-1">İndir</a>
            </div>
        </div>
    </div>

    <footer id="footer">
        <button id="resume-button">Ana Sayfa'ya Dön</button>
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
