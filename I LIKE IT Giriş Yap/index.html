<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LIKE IT Giriş Yap</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="information">
        <span id="closebtn" onclick="this.parentElement.style.display='none';">&times;</span> 
        <p id="info-p">I LIKE IT © 2021 | <a href="#" id="info-a">Ayaz Aybek</a> yapımı </p>
    </div>

    <header id="header">
        <img src="./Logo.jpg" id="header-img" alt="I LIKE IT Logo">
        <h1 id="line">|</h1>
        <h1 id="header-h1">I LIKE IT</h1>
        <button id="header-menu">📂</button>
        <button id="header-help">?</button>
    </header>

    <div id="main-div-1"><br>
        <h1 id="main-div-1-h1">I LIKE IT</h1>
        <img src="./Logo.jpg" alt="I LIKE IT Logo" id="main-div-1-img">
        <h2 id="main-div-2-h2">Arkadaşlarınla beraber güzel vakitler geçirin ve eğlenin!</h2>
        <img src="./finger.jpg" alt="I LIKE IT Resim" id="i-like-it-img">
        <p id="main-div-1-p">I LIKE IT Mobil uygulaması yakında!</p>

    </div>

    <div id="main-div-2">
        <label for="email" id="label1" class="labels">E-Posta:</label>
        <input type="email" id="email">

        <label for="password" id="label2" class="labels">Parola:</label>
        <input type="password" id="password">

        <button id="login" class="buttons"><p class="buttons-p">Giriş Yap</p></button><br>
        <button id="register" class="buttons"><p class="buttons-p">Kayıt Ol</p></button>
        <br><br><br><hr>

        <p id="main-div-2-head">Kayıtlı Hesaplar</p><hr>

        <div id="main-div-2-1">
            <img src="./1.jpg" alt="Img" id="main-div-2-1-img">
            <p id="main-div-2-1-acc-mail">frostaybek@gmail.com</p>
            <p id="main-div-2-1-acc-username">@frostaybek</p>
            <button id="main-div-2-1-acc-main-login-button">Giriş Yap</button>
        </div>
        <div id="main-div-2-2">
            <img src="./Logo.jpg" alt="Img" id="main-div-2-1-img-2">
            <p id="main-div-2-1-acc-mail-2">info@frostagram.com</p>
            <p id="main-div-2-1-acc-username-2">@frostagram</p>
            <button id="main-div-2-1-acc-main-login-button-2">Giriş Yap</button>
        </div>
        <div id="main-div-2-3">
            <img src="./Duck.gif" alt="Img" id="main-div-2-1-img-3">
            <p id="main-div-2-1-acc-mail-3">duck@hotmail.com</p>
            <p id="main-div-2-1-acc-username-3">@duck</p>
            <button id="main-div-2-1-acc-main-login-button-3">Giriş Yap</button>
        </div>
    </div>
    
    <footer id="footer">
        <button id="language-button">TR</button>
        <button id="dark-mode-button">Koyu Mod</button>
    </footer>
    
</body>
</html>
